<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyShop - Главная</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="logo">🛍️ MyShop</a>
            <div class="nav-menu">
                <a href="/" class="nav-link active">Главная</a>
                <a href="/pages/products.html" class="nav-link">Товары</a>
                <a href="/pages/cart.html" class="nav-link">Корзина</a>
                <a href="/pages/orders.html" class="nav-link">Заказы</a>
                <a href="/pages/profile.html" class="nav-link">Профиль</a>
            </div>
            <div class="nav-auth" id="navAuth">
                <button onclick="showLogin()" class="btn btn-primary">Войти</button>
                <button onclick="showRegister()" class="btn btn-success">Регистрация</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="hero">
            <h1>🛍️ Добро пожаловать в MyShop</h1>
            <p>Лучшие товары по доступным ценам</p>
        </div>

        <div class="auth-container" id="authContainer">
            <!-- Форма входа -->
            <div class="auth-card" id="loginCard">
                <h2>🔐 Вход</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail">Email</label>
                        <input type="email" id="loginEmail" placeholder="example@mail.ru" required>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Пароль</label>
                        <input type="password" id="loginPassword" placeholder="********" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Войти</button>
                </form>
                <p class="auth-switch">
                    Нет аккаунта? <a id="switchToRegister">Зарегистрироваться</a>
                </p>
                <div id="loginError" class="error-message hidden"></div>
            </div>

            <!-- Форма регистрации -->
            <div class="auth-card hidden" id="registerCard">
                <h2>📝 Регистрация</h2>
                <form id="registerForm">
                    <div class="form-group">
                        <label for="registerFullName">Полное имя</label>
                        <input type="text" id="registerFullName" placeholder="Иван Иванов" required>
                    </div>
                    <div class="form-group">
                        <label for="registerEmail">Email</label>
                        <input type="email" id="registerEmail" placeholder="example@mail.ru" required>
                    </div>
                    <div class="form-group">
                        <label for="registerPassword">Пароль</label>
                        <input type="password" id="registerPassword" placeholder="Минимум 6 символов" required minlength="6">
                    </div>
                    <button type="submit" class="btn btn-success btn-block">Зарегистрироваться</button>
                </form>
                <p class="auth-switch">
                    Уже есть аккаунт? <a id="switchToLogin">Войти</a>
                </p>
                <div id="registerError" class="error-message hidden"></div>
                <div id="registerSuccess" class="success-message hidden"></div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script type="module" src="/static/js/api.js"></script>
    <script type="module" src="/static/js/auth.js"></script>
    <script type="module" src="/static/js/products.js"></script>
    <script type="module" src="/static/js/cart.js"></script>
    <script type="module" src="/static/js/orders.js"></script>
    <script type="module" src="/static/js/main.js"></script>

    <script type="module">
        import { authService } from '/static/js/auth.js';

        window.showLogin = function() {
            document.getElementById('loginCard').classList.remove('hidden');
            document.getElementById('registerCard').classList.add('hidden');
        };

        window.showRegister = function() {
            document.getElementById('registerCard').classList.remove('hidden');
            document.getElementById('loginCard').classList.add('hidden');
        };

        document.getElementById('switchToRegister')?.addEventListener('click', (e) => {
            e.preventDefault();
            showRegister();
        });

        document.getElementById('switchToLogin')?.addEventListener('click', (e) => {
            e.preventDefault();
            showLogin();
        });

        // Регистрация
        document.getElementById('registerForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fullName = document.getElementById('registerFullName').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;

            const errorDiv = document.getElementById('registerError');
            const successDiv = document.getElementById('registerSuccess');
            
            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');

            try {
                await authService.register({
                    full_name: fullName,
                    email: email,
                    password: password
                });

                successDiv.textContent = '✅ Регистрация успешна!';
                successDiv.classList.remove('hidden');
                document.getElementById('registerForm').reset();
                
                setTimeout(() => {
                    showLogin();
                    document.getElementById('loginEmail').value = email;
                }, 1500);

            } catch (error) {
                errorDiv.textContent = error.message || 'Ошибка регистрации';
                errorDiv.classList.remove('hidden');
            }
        });

        // Вход
        document.getElementById('loginForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            const errorDiv = document.getElementById('loginError');
            errorDiv.classList.add('hidden');

            try {
                await authService.login(email, password);
                window.location.href = '/pages/products.html';
            } catch (error) {
                errorDiv.textContent = error.message || 'Ошибка входа';
                errorDiv.classList.remove('hidden');
            }
        });

        // Если уже авторизован - редирект на товары
        if (authService.checkAuth() && authService.getCurrentUser()) {
            window.location.href = '/pages/products.html';
        }
    </script>
</body>
</html>
