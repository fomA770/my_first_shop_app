<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль - MyShop</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="logo">🛍️ MyShop</a>
            <div class="nav-menu">
                <a href="/" class="nav-link">Главная</a>
                <a href="/pages/products.html" class="nav-link">Товары</a>
                <a href="/pages/cart.html" class="nav-link">Корзина</a>
                <a href="/pages/orders.html" class="nav-link">Заказы</a>
                <a href="/pages/profile.html" class="nav-link active">Профиль</a>
            </div>
            <div class="nav-auth" id="navAuth">
                <button onclick="window.location.href='/'">Войти</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1 class="mt-2">👤 Профиль</h1>
        
        <div id="profileContainer">
            <div class="loading">Загрузка профиля</div>
        </div>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script type="module" src="/static/js/api.js"></script>
    <script type="module" src="/static/js/auth.js"></script>
    <script type="module" src="/static/js/products.js"></script>
    <script type="module" src="/static/js/cart.js"></script>
    <script type="module" src="/static/js/orders.js"></script>
    <script type="module" src="/static/js/main.js"></script>

    <script type="module">
        import { authService } from '/static/js/auth.js';
        import { showToast, requireAuth } from '/static/js/main.js';

        if (!requireAuth()) return;

        function loadProfile() {
            const container = document.getElementById('profileContainer');
            const user = authService.getCurrentUser();

            if (!user) {
                container.innerHTML = `
                    <div class="card text-center">
                        <p>Пользователь не найден</p>
                        <button onclick="window.location.href='/'">Войти</button>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="card">
                    <div class="profile-header">
                        <div class="profile-avatar">👤</div>
                        <div class="profile-info">
                            <h2>${user.full_name}</h2>
                            <p>📧 ${user.email}</p>
                            <p>📊 Статус: ${user.is_active ? '✅ Активен' : '❌ Неактивен'}</p>
                            <p>🎭 Роли: ${user.roles && user.roles.length > 0 ? user.roles.map(r => r.name).join(', ') : 'Нет ролей'}</p>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <h3>🛡️ Действия</h3>
                    <div style="display:flex;gap:1rem;flex-wrap:wrap;margin-top:1rem;">
                        <a href="/pages/orders.html" class="btn btn-primary">📋 Мои заказы</a>
                        <a href="/pages/cart.html" class="btn btn-success">🛒 Корзина</a>
                        <button onclick="window.authService.logout()" class="btn btn-danger">🚪 Выйти</button>
                    </div>
                </div>

                ${user.roles && user.roles.some(r => r.name === 'admin' || r.name === 'manager') ? `
                    <div class="card">
                        <h3>🔧 Админ-панель</h3>
                        <div style="display:flex;gap:1rem;flex-wrap:wrap;margin-top:1rem;">
                            <button onclick="showAdminPanel()" class="btn btn-warning">📦 Управление товарами</button>
                        </div>
                        <div id="adminPanel" class="hidden" style="margin-top:1rem;">
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Название товара</label>
                                    <input type="text" id="adminName" placeholder="Название">
                                </div>
                                <div class="form-group">
                                    <label>Категория</label>
                                    <input type="text" id="adminCategory" placeholder="Категория">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Цена</label>
                                    <input type="number" id="adminPrice" placeholder="0" step="0.01">
                                </div>
                                <div class="form-group">
                                    <label>Количество</label>
                                    <input type="number" id="adminStock" placeholder="0">
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Описание</label>
                                <textarea id="adminDescription" rows="3" placeholder="Описание товара"></textarea>
                            </div>
                            <button onclick="createProduct()" class="btn btn-success">➕ Добавить товар</button>
                        </div>
                    </div>
                ` : ''}
            `;

            // Делаем глобальными для кнопок
            window.showAdminPanel = function() {
                const panel = document.getElementById('adminPanel');
                panel.classList.toggle('hidden');
            };

            window.createProduct = async function() {
                const name = document.getElementById('adminName').value;
                const category = document.getElementById('adminCategory').value;
                const price = parseFloat(document.getElementById('adminPrice').value);
                const storage_count = parseInt(document.getElementById('adminStock').value);
                const description = document.getElementById('adminDescription').value;

                if (!name || !category || !price || !storage_count) {
                    showToast('Заполните все поля', 'error');
                    return;
                }

                try {
                    const { productsService } = await import('/static/js/products.js');
                    await productsService.createProduct({
                        name,
                        category,
                        price,
                        storage_count,
                        description
                    });
                    showToast('✅ Товар создан!', 'success');
                    
                    // Очищаем форму
                    document.getElementById('adminName').value = '';
                    document.getElementById('adminCategory').value = '';
                    document.getElementById('adminPrice').value = '';
                    document.getElementById('adminStock').value = '';
                    document.getElementById('adminDescription').value = '';
                } catch (error) {
                    showToast('❌ Ошибка: ' + error.message, 'error');
                }
            };
        }

        loadProfile();
    </script>
</body>
</html>
